# ===============================
# SERVER
# ===============================
server.port=8082

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.kapsulesolution=DEBUG

# Include correlationId from MDC
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{correlationId}] - %msg%n

# ===============================
# LLM CONFIG
# ===============================

# Default provider (openai / gemini / others)
llm.default-provider=openai

# Default temperature (used if not passed in request)
llm.default-temperature=0.7

# Default model (optional but recommended)
llm.default-model=gpt-4o-mini

# OpenAI Config
llm.openai-url=https://api.openai.com/v1/chat/completions

# IMPORTANT: use env variable instead of hardcoding
llm.openai-api-key=${OPENAI_API_KEY}

# ===============================
# TIMEOUT (recommended)
# ===============================
# (use when you move to WebClient later)
llm.timeout-ms=30000
llm.model=gpt-4.1
